name: Check and release library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    uses: ./.github/workflows/library-release.yml
    with:
      helper_revision: ${{ github.sha }}
      app_id: ${{ vars.LIBRARY_DISPATCH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.LIBRARY_DISPATCH_APP_PRIVATE_KEY }}
